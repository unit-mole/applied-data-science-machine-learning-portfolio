name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install portfolio dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify runtime and scientific stack
        run: python scripts/check_runtime.py
      - name: Validate structure, links, syntax, and recorded outputs
        run: python validate_portfolio.py
      - name: Run lightweight tests
        run: python -m unittest discover -s tests -v
