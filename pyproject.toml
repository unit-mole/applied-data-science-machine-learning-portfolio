[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-data-science-portfolio-rebuilt"
version = "2.0.0"
description = "Thirteen fully executed, evidence-backed applied data science case studies."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Anmol Tripathi"}]
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2.3,<3",
  "scipy>=1.14.1,<2",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9.2,<4",
  "openpyxl>=3.1.5,<4",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.3,<5", "ipykernel>=6.29,<8"]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["portfolio_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
